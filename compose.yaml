services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
