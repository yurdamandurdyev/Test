name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen --extra test
      - run: npm ci
      - run: python scripts/build_standalone.py
      - run: git diff --exit-code -- deliverables/02-analyze-leads.py
      - run: .venv/bin/pytest -q
      - run: npm test
      - run: npm run build
      - run: npm audit
      - run: python scripts/security_check.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: node scripts/check_offline.mjs artifacts
